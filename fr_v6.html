tx:["In den Pariser Salons und Cafés diskutierte das gebildete Bürgertum neue Ideen: Montesquieu forderte in „Vom Geist der Gesetze“ (1748) die Gewaltenteilung, Voltaire kämpfte für Toleranz und gegen Kirchen- und Willkürherrschaft, Rousseau begründete im „Gesellschaftsvertrag“ (1762) die Volkssouveränität. Diderot und d’Alembert sammelten das Wissen der Zeit in der Encyclopédie.","Die Amerikanische Revolution (Unabhängigkeitserklärung 1776) zeigte, dass diese Ideen umsetzbar waren; französische Offiziere wie Lafayette hatten dort mitgekämpft. Im Januar 1789 fragte Abbé Sieyès in einer Flugschrift „Was ist der Dritte Stand?“ und antwortete: alles. Die Ideen kamen aus ganz Europa: Klicke auf der Karte die fünf Denker in ihrer Heimat an (Locke, Montesquieu, Voltaire, Rousseau, Kant) und zoome bei Bedarf heraus."],
f:[["Locke","Naturrechte, Widerstandsrecht"],["Montesquieu","Gewaltenteilung"],["Voltaire","Toleranz, Kritik an Willkür"],["Rousseau","Volkssouveränität"],["Kant","Mündigkeit, „Sapere aude“"]],
task:"Klicke die fünf Denker an und ordne ihre Ideen den Forderungen der Revolution zu (Gewaltenteilung, Volkssouveränität, Menschenrechte, Toleranz).",
mat:[YT("Aufklärung Montesquieu Voltaire Rousseau erklärt"),LA("Aufklärung Philosophen"),WK("Aufklärung")]},
{t:"Krise & Generalstände",sd:"1788–5. Mai 1789",ic:"🏛️",d:"1788 – 5. Mai 1789",cam:[2.24,48.83,24],ln:[],en:[],
tx:["Die Staatsschulden waren durch Kriege (auch den Beistand für die USA) so hoch, dass etwa die Hälfte der Einnahmen in den Schuldendienst floss. Reformen scheiterten am Widerstand der Privilegierten. Missernten und ein harter Winter 1788/89 ließen die Brotpreise steigen. Der König berief schließlich erstmals seit 1614 die Generalstände ein.","In ganz Frankreich schrieben die Menschen Beschwerdehefte (Cahiers de doléances). Der Dritte Stand erhielt doppelt so viele Abgeordnete (ca. 600 von 1.200), doch ob nach Ständen oder nach Köpfen abgestimmt wird, blieb offen. Am 5. Mai 1789 eröffnete Ludwig XVI. die Versammlung in Versailles, ohne die Streitfrage zu klären."],
f:[["Finanzminister","Turgot, Necker, Calonne, Brienne"],["Eröffnung","5. Mai 1789, Versailles"],["Streitfrage","Abstimmung nach Ständen oder Köpfen"]],

{t:"Nationalversammlung & Ballhausschwur",sd:"17.–20. Juni 1789",ic:"✊",d:"17. – 20. Juni 1789",cam:[2.24,48.83,24],ln:[],en:[],
tx:["Nach wochenlangem Streit erklärte sich der Dritte Stand am 17. Juni auf Antrag von Sieyès zur Nationalversammlung, weil er 96 % der Nation vertrete. Damit stellte er die Volkssouveränität über die Ständeordnung. Am 20. Juni fanden die Abgeordneten ihren Saal verschlossen und wichen in das nahe Ballhaus (Jeu de Paume) aus.","Dort schworen sie, nicht auseinanderzugehen, bis Frankreich eine Verfassung hat. Ein Abgeordneter verweigerte den Eid. Der König versuchte noch, die Beschlüsse für ungültig zu erklären (23. Juni), gab aber am 27. Juni nach und forderte auch Klerus und Adel auf, sich anzuschließen. Am 9. Juli nannte sich die Versammlung Verfassunggebende Nationalversammlung."],
f:[["17. Juni","Dritter Stand = Nationalversammlung"],["20. Juni","Ballhausschwur"],["9. Juli","Verfassunggebende Versammlung"]],
task:"Begründe, warum die Gründung der Nationalversammlung bereits ein revolutionärer Akt war.",

{t:"Sturm auf die Bastille",sd:"14. Juli 1789",ic:"🏰",d:"14. Juli 1789",cam:[2.3522,48.8566,40],ln:[],en:[],
tx:["Am 11. Juli entließ der König den beliebten Minister Necker und ließ Truppen um Paris zusammenziehen. Die Pariser fürchteten einen Gewaltstreich gegen die Versammlung. Am 14. Juli holten sich Tausende Waffen aus dem Invalidendom und zogen vor die Bastille, wo Pulver lagerte.","Nach Verhandlungen und Schüssen ergab sich die Besatzung; Gouverneur de Launay wurde getötet. Es gab nur sieben Gefangene, doch die Festung galt als Symbol der Willkür. Der Sturm rettete die Nationalversammlung. Paris bekam eine Stadtregierung und eine Bürgerwehr (Nationalgarde unter Lafayette) mit der Kokarde in Blau-Rot und Weiß, der späteren Trikolore. Der 14. Juli ist heute Nationalfeiertag."],
f:[["Auslöser","Entlassung Neckers, Truppenaufmarsch"],["Opfer","ca. 100 Angreifer, 7 Gefangene befreit"],["Folge","Nationalgarde, Trikolore, Emigration beginnt"]],
task:"Warum war der Sturm auf die Bastille militärisch unbedeutend, politisch aber ein Wendepunkt?",
mat:[YT("Sturm auf die Bastille 14. Juli 1789 erklärt"),LA("Sturm auf die Bastille"),WK("Sturm auf die Bastille")]},
{t:"Menschenrechte",sd:"4./26. August 1789",ic:"📜",d:"Juli – August 1789",cam:[2.24,48.83,24],ln:[],en:[],
tx:["Im Sommer erfasste die „Große Furcht“ das Land: Bauern fürchteten Räuberbanden und Adelsrache, stürmten Schlösser und verbrannten Urkunden über Abgaben. In der Nacht vom 4. August erklärte die Versammlung die Feudalrechte und Standesprivilegien für abgeschafft, in der Praxis mussten viele Lasten aber noch abgelöst werden.","Am 26. August verabschiedete sie die Erklärung der Menschen- und Bürgerrechte: Alle Menschen sind frei und gleich an Rechten, Ziel der Politik ist der Schutz von Freiheit, Eigentum, Sicherheit und Widerstand gegen Unterdrückung, die Souveränität liegt bei der Nation, Gesetze gelten für alle, Gewaltenteilung sichert die Rechte (Art. 16). Frauen blieben ausgeschlossen. Olympe de Gouges forderte deshalb 1791 eine „Erklärung der Rechte der Frau“."],
f:[["4. August","Abschaffung des Feudalsystems"],["26. August","Menschen- und Bürgerrechte"],["Vorbild","Virginia Bill of Rights 1776"]],
task:"Vergleiche die Erklärung von 1789 mit dem Grundgesetz: Welche Rechte finden sich wieder, welche Gruppen waren 1789 nicht gemeint?",

{t:"Marsch der Frauen",sd:"5./6. Oktober 1789",ic:"🥖",d:"5. – 6. Oktober 1789",cam:[2.24,48.825,30],ln:["fw"],en:[],
tx:["Der König zögerte, die Beschlüsse vom August zu bestätigen, und in Paris fehlte das Brot. Am 5. Oktober zogen Tausende Marktfrauen von den Hallen zu Fuß im Regen die rund 20 km nach Versailles, um Brot und die Bestätigung der Beschlüsse zu fordern. Die Nationalgarde unter Lafayette folgte am Abend.","Der König gab nach. Am Morgen des 6. Oktober drang die Menge ins Schloss ein, Leibgardisten wurden getötet. Die königliche Familie wurde in einem Zug mit der Menge nach Paris in die Tuilerien gebracht, die Nationalversammlung folgte. Damit stand der Hof unter der Kontrolle der Hauptstadt."],

{t:"Flucht nach Varennes",sd:"20./21. Juni 1791",ic:"🚪",d:"20. – 25. Juni 1791",cam:[3.9,49.0,6],ln:["fl","rt"],en:[],
tx:["Der König lehnte die Kirchenpolitik der Revolution ab und sah sich als Gefangener. In der Nacht vom 20. auf den 21. Juni floh die Königsfamilie verkleidet aus den Tuilerien Richtung Montmédy, wo der Marquis de Bouillé Truppen sammelte. Ludwig hinterließ eine Erklärung, in der er die Revolution verurteilte.","Postmeister Drouet erkannte ihn, in Varennes wurde die Kutsche am Abend des 21. Juni angehalten, am 25. Juni war die Familie zurück in Paris. Der Vertrauensverlust war enorm: Viele sahen den König nun als Verräter. Trotzdem erklärte die Versammlung ihn zum Entführten. Die Verfassung vom September 1791 machte Frankreich zur konstitutionellen Monarchie."],
f:[["Ziel","Montmédy, Grenze zu den Österr. Niederlanden"],["Gescheitert","Varennes, 21. Juni 1791"],["Verfassung","3. September 1791"]],

{t:"Krieg & Republik",sd:"1792",ic:"⚔️",d:"April – September 1792",cam:[4.2,48.9,6],ln:["kv"],en:["at","de"],
tx:["Am 20. April 1792 erklärte Frankreich Österreich den Krieg: Der Hof hoffte auf eine Niederlage, die Girondisten auf die Verbreitung der Revolution. Das Heer war schlecht geführt, ein preußisch-österreichisches Heer rückte vor. Im Juli drohte das Manifest des Herzogs von Braunschweig Paris mit Vergeltung, falls der Königsfamilie etwas geschehe.","Daraufhin stürmten am 10. August Pariser Sansculotten und Föderierte aus den Provinzen die Tuilerien. Der König wurde abgesetzt, im September kam es zu den Septembermorden an Gefangenen. Am 20. September stoppte das Revolutionsheer die Preußen bei Valmy. Am 21./22. September 1792 schaffte der neue Nationalkonvent das Königtum ab; es begann Jahr I der Republik. Die Marseillaise (Rouget de Lisle, Straßburg 1792) wurde zum Kriegslied."],
f:[["20.4.","Kriegserklärung an Österreich"],["10.8.","Sturm auf die Tuilerien"],["20.9.","Kanonade von Valmy"],["22.9.","Ausrufung der Republik"]],

{t:"Tod des Königs",sd:"21. Januar 1793",ic:"🔪",d:"Dezember 1792 – Januar 1793",cam:[2.3522,48.8566,40],ln:[],en:["at","de","gb","es","nl"],
tx:["Im November 1792 fand man in den Tuilerien einen geheimen Schrank mit Briefen des Königs an Gegner der Revolution. Der Konvent stellte „Bürger Louis Capet“ vor Gericht: Er wurde des Hochverrats schuldig gesprochen und mit knapper Mehrheit zum Tod verurteilt, ein Aufschub wurde abgelehnt.","Am 21. Januar 1793 wurde Ludwig XVI. auf dem Place de la Révolution (heute Place de la Concorde) mit der Guillotine hingerichtet, Marie-Antoinette folgte im Oktober. Die Hinrichtung vertiefte die Spaltung im Land und trieb die Monarchien Europas zusammen: Großbritannien, Niederlande und Spanien traten der Ersten Koalition gegen Frankreich bei."],
f:[["Prozess","Dezember 1792 – Januar 1793"],["Hinrichtung","21. Januar 1793, Paris"],["Folge","Erste Koalition gegen Frankreich"]],

{t:"Terreur",sd:"1793–1794",ic:"🩸",d:"Juni 1793 – Juli 1794",cam:[2.5,46.8,2.7],ln:["tl","tv","tt"],en:["at","de","gb","es","nl","pt"],
tx:["Frankreich stand 1793 vor Invasion, Wirtschaftskrise und Bürgerkrieg: In der Vendée erhob sich der Westen, in Lyon, Marseille und Toulon die „Föderalisten“. Der Konvent stärkte den Wohlfahrtsausschuss (ab Juli 1793 mit Robespierre), schuf das Revolutionstribunal, das „Gesetz der Verdächtigen“ (Sept. 1793) und die Massenaushebung (levée en masse).","In der Terreur (Schreckensherrschaft) wurden mindestens 17.000 Menschen offiziell hingerichtet, darunter die Königin, Girondisten und 1794 auch Danton. Mehr Menschen starben ohne Urteil in Gefängnissen und im Vendée-Krieg. Robespierre rechtfertigte den Terror als Tugend der Republik. Die Republik hielt militärisch stand, kostete aber Freiheitsrechte, die sie 1789 verkündet hatte."],
f:[["Organe","Wohlfahrtsausschuss, Revolutionstribunal"],["Opfer","mind. 17.000 Hinrichtungen, weit mehr Tote insgesamt"],["Rechtfertigung","Verteidigung der Republik"]],

{t:"Thermidor & Napoleon",sd:"1794–1799",ic:"🌍",d:"Juli 1794 – November 1799",cam:[17,49,1],ln:["n1","n2","n3","n4","n5"],en:["at","de","gb","ru"],
tx:["Am 9. Thermidor (27. Juli 1794) stürzte der Konvent Robespierre, der am nächsten Tag hingerichtet wurde. Das Direktorium (ab 1795) regierte schwach, abhängig von Armee und wechselnden Mehrheiten. Der junge General Napoleon Bonaparte stieg auf, erst durch Toulon 1793, dann durch den Italienfeldzug (1796/97) und die Ägyptenexpedition (1798).","Am 18. Brumaire (9. November 1799) stürzte er mit einem Staatsstreich das Direktorium und wurde Erster Konsul, 1804 Kaiser. Die Revolutionskriege gingen in die napoleonischen Kriege über. Zoome auf der Karte heraus: Wien, Berlin, Madrid und Moskau markieren, wie Napoleon bis 1812 fast ganz Europa neu ordnete."],

const PS=[
["Palais-Royal",2.3371,48.8638,"🗣️","12. Juli 1789",220,150,"Der Palais-Royal gehörte dem Herzog von Orléans und war durch seine Arkaden ein Treffpunkt von Journalisten, Rednern und Händlern, den die Polizei kaum kontrollieren konnte. Am 12. Juli 1789, einen Tag nach der Entlassung Neckers, rief Camille Desmoulins hier zu den Waffen. Die Menge steckte sich grüne Blätter als Zeichen an.","Palais-Royal","#b89e78"],
["Invalidendom",2.3126,48.8560,"🛡️","14. Juli 1789",430,220,"Am Morgen des 14. Juli holten sich Tausende Pariser rund 30.000 Gewehre aus dem Invalidenhaus. Es fehlte aber Munition, und Pulver vermutete man in der Bastille. Das war der Anlass, dorthin zu ziehen.","Les_Invalides","#c9b56a"],
["Bastille",2.3691,48.8532,"🏰","14. Juli 1789",75,55,"Die Festung am Rand des Faubourg Saint-Antoine diente als Staatsgefängnis und war Symbol der Willkür. Nach Verhandlungen und Schüssen ergab sich die Besatzung, Gouverneur de Launay wurde getötet. Es gab nur sieben Gefangene. Die Bastille wurde ab Juli 1789 abgerissen, der Platz heißt bis heute Place de la Bastille.","Bastille","#6b6b73"],
["Hôtel de Ville",2.3522,48.8566,"🏛️","15. Juli 1789 – 28. Juli 1794",100,70,"Nach dem 14. Juli wurde hier der Astronom Bailly zum Bürgermeister gewählt, Lafayette übernahm die Nationalgarde. Später tagte hier die radikale Pariser Kommune. In der Nacht zum 28. Juli 1794 (9. Thermidor) wurde Robespierre im Hôtel de Ville festgenommen.","H%C3%B4tel_de_Ville,_Paris","#b89e78"],
["Les Halles",2.3470,48.8625,"🥖","5. Oktober 1789",250,140,"Der Zentralmarkt und seine Viertel: Von hier und aus den Nachbarvierteln brachen am 5. Oktober 1789 die Frauen auf, die Brot forderten, und zogen nach Versailles. Marktfrauen galten als besonders resolut und genossen eine Sonderstellung gegenüber dem König.","Les_Halles","#b89e78"],
["Tuilerien",2.3320,48.8632,"🏯","Okt. 1789 – 10. Aug. 1792",55,260,"Nach dem Frauenmarsch zog die Königsfamilie am 6. Oktober 1789 in das Stadtschloss. Im benachbarten Reitsaal (Manège) tagte die Nationalversammlung. Von hier floh die Familie in der Nacht zum 21. Juni 1791. Am 10. August 1792 wurde das Schloss gestürmt, viele Schweizergardisten starben. Das Gebäude brannte 1871 ab.","Tuileries_Palace","#c9a15a"],
["Marsfeld",2.3010,48.8570,"🎪","14. Juli 1790 / 17. Juli 1791",0,0,"Auf dem Marsfeld feierten am 14. Juli 1790 Hunderttausende das Föderationsfest mit Eid auf Nation, Gesetz und König. Am 17. Juli 1791 schoss die Nationalgarde hier auf eine Menge, die nach der Flucht des Königs die Republik forderte (Marsfeld-Massaker, mehrere Dutzend Tote).","Champ_de_Mars","#bcd6a0"],
["Temple",2.3612,48.8641,"⛓️","13. Aug. 1792 – Jan. 1793",120,100,"Die frühere Templerburg diente nach dem Sturz des Königs als Gefängnis: Am 13. August 1792 wurde die Königsfamilie hier eingesperrt. Am 21. Januar 1793 führte man Ludwig XVI. von hier zur Hinrichtung. Sein Sohn (Ludwig XVII.) starb 1795 in der Haft.","Tour_du_Temple","#8c7a5a"],
["Place de la Révolution",2.3212,48.8656,"🔪","21. Jan. 1793",260,200,"Der heutige Place de la Concorde war Hinrichtungsplatz. Hier fiel am 21. Januar 1793 der Kopf Ludwigs XVI., später folgten Marie-Antoinette (16. Oktober 1793), Danton (April 1794) und Robespierre (28. Juli 1794). Der Platz heißt seit 1795 Place de la Concorde.","Place_de_la_Concorde","none"],
["Notre-Dame",2.3499,48.8530,"⛪","10. Nov. 1793",130,45,"Im Zuge der Entchristlichung wurde die Kathedrale 1793 zum „Tempel der Vernunft“. Am 10. November 1793 fand hier ein Fest der Vernunft statt. Statuen der Königsgalerie wurden abgeschlagen, weil man sie für französische Könige hielt (es waren biblische Könige).","Notre-Dame_de_Paris","#b89e78"],
["Conciergerie",2.3457,48.8559,"⚖️","März 1793 – 1794",220,70,"Der Justizpalast auf der Île de la Cité war Sitz des Revolutionstribunals (ab März 1793), die Conciergerie das Gefängnis. Hier wartete Marie-Antoinette bis zu ihrer Hinrichtung am 16. Oktober 1793, ebenso Danton. Tausende Gefangene gingen von hier zur Guillotine.","Conciergerie","#8c7a5a"]];

["Spiegelsaal",...M(-60,0),"🪞","ab 1682",0,0,"Die 73 m lange Spiegelgalerie an der Gartenfront wurde ab 1682 zum Schauplatz der Hofhaltung Ludwigs XIV. Der Adel lebte hier nach strengem Zeremoniell (etwa beim „Lever“ des Königs) und war so an den Monarchen gebunden, statt in den Provinzen eigene Macht aufzubauen. Das war der Kern des Absolutismus.","Hall_of_Mirrors",null,"l"],
["Gärten & Grand Canal",2.0978,48.8045,"🌳","ab 1661",0,0,"André Le Nôtre legte die Gärten ab 1661 streng geometrisch an. Alles ordnet sich der Mittelachse unter, die vom Schloss über den Tapis Vert zum Grand Canal (rund 1,5 km) führt. Das Wasserkreuz diente auch für Bootsfahrten und Feste des Hofes. Der Park gilt als Sinnbild für die Herrschaft über Natur und Untertanen.","Gardens_of_Versailles",null],
["Salle des Menus-Plaisirs",2.1325,48.8062,"📜","5. Mai – 26. Aug. 1789",90,35,"Im Hôtel des Menus-Plaisirs, dem Lager des Hofes für Feste und Bühnentechnik, wurde die große Versammlungshalle eingerichtet. Hier eröffnete Ludwig XVI. am 5. Mai 1789 die Generalstände. Danach tagte hier die Nationalversammlung, am 26. August 1789 beschloss sie die Erklärung der Menschen- und Bürgerrechte. Die Lage ist auf dem Plan angenähert.","Estates_General_of_1789","#b89e78"],
["Ballhaus (Jeu de Paume)",2.1305,48.8035,"🎾","20. Juni 1789",40,22,"Am 20. Juni 1789 fanden die Abgeordneten des Dritten Standes ihren Saal verschlossen und wichen in die nahe Tennishalle des Königs aus. Hier schworen sie, nicht auseinanderzugehen, bis Frankreich eine Verfassung hat. Jacques-Louis David plante ein Monumentalgemälde, das unvollendet blieb. Die Lage ist auf dem Plan angenähert.","Tennis_Court_Oath","#b89e78"],
["Petit Trianon",2.1095,48.8155,"🌸","5. Okt. 1789",40,40,"Das Petit Trianon war der private Rückzugsort Marie-Antoinettes, ein Geschenk Ludwigs XVI. Hier erreichte sie am 5. Oktober 1789 die Nachricht vom Marsch der Frauen auf Versailles. Sie kehrte ins Schloss zurück. Zum Park gehört auch das Hameau de la Reine, ein künstliches Dörfchen.","Petit_Trianon","#d8c9a0"],
["Place d'Armes",...M(450,0),"🐎","5. Okt. 1789",0,0,"Vor dem Schloss laufen die drei Avenuen nach Paris, Saint-Cloud und Sceaux zusammen. Dieser Aufbau der Stadt sollte die Macht des Königs sichtbar machen. Am Abend des 5. Oktober 1789 sammelte sich hier die Menge der Frauen. Lafayette traf in der Nacht mit der Nationalgarde ein.","Palace_of_Versailles",null],
["Marmorhof",...M(120,0),"👑","6. Okt. 1789",0,0,"In den Morgenstunden des 6. Oktober drang die Menge ins Schloss ein, Leibgardisten starben. Auf Drängen der Menge trat die königliche Familie auf den Balkon über dem Marmorhof, Lafayette küsste der Königin die Hand. Am Mittag fuhren sie nach Paris, wo sie in die Tuilerien zogen.","Palace_of_Versailles",null]];
